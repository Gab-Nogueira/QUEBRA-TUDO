[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-assistida"
version = "0.1.0"
description = "Ferramentas locais para consultas assistidas e demonstrações de navegador."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright==1.64.1"]

[project.optional-dependencies]
automatico = [
    "ddddocr==1.6.1",
    "faster-whisper==1.2.1",
    "av==15.1.0",
]
web = [
    "flask==3.1.3",
    "waitress==3.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
consulta_assistida = ["fixtures/*.html", "web_demo/README.md", "web_demo/static/*"]
